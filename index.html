<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="The official site of the Davinky Hockey League: standings, rosters, the eight clubs and the adidas Hometown Remix Classic.">
  <meta name="theme-color" content="#05070b">
  <meta property="og:title" content="Davinky Hockey League">
  <meta property="og:description" content="Standings, rosters, uniforms and the adidas Hometown Remix Classic.">
  <meta property="og:type" content="website">

  <style>
    :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    body { margin: 0; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    img { max-width: 100%; }
    [hidden] { display: none !important; }
  </style>
<title>Davinky Hockey League</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: the site opens black, lifts into the rink film, then settles into a
   1120px column of arena-dark panels. Team colour enters through --team. */
:root {
  --ink: #05070b;
  --panel: #0d121a;
  --panel2: #121a26;
  --line: rgba(156,180,214,.14);
  --fg: #eaeff7;
  --dim: #8a95ab;
  --ice: #6fc5ff;
  --gold: #f2c14e;
  --team: #6fc5ff;
  --disp: "Barlow Condensed", "Haettenschweiler", Impact, sans-serif;
  --body: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: #03050a; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, .disp { font-family: var(--disp); text-transform: uppercase; margin: 0; text-wrap: balance; }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tnum { font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
.small { font-size: 12.5px; }
.eyebrow { font-family: var(--disp); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); font-weight: 600; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: rgba(3,5,10,.93); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar { display: flex; align-items: center; gap: 18px; height: 56px; }
.mark { display: flex; align-items: baseline; gap: 8px; font-family: var(--disp); font-weight: 700; font-size: 25px; line-height: 1; letter-spacing: .04em; }
.mark b { color: var(--ice); }
.mark span { font-size: 11px; letter-spacing: .22em; color: var(--dim); font-weight: 600; }
nav.main { margin-left: auto; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.main::-webkit-scrollbar { display: none; }
nav.main a { font-family: var(--disp); font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); padding: 8px 11px; border-radius: 4px; white-space: nowrap; }
nav.main a:hover { color: var(--fg); background: rgba(255,255,255,.05); }
nav.main a[aria-current="page"] { color: var(--ink); background: var(--ice); }
@media (max-width: 700px) {
  .topbar { height: auto; flex-wrap: wrap; gap: 0; padding-block: 8px 0; }
  .mark { font-size: 22px; } .mark span { font-size: 9px; letter-spacing: .14em; }
  nav.main { order: 3; width: 100%; margin: 4px -4px 0; padding: 0 4px 6px; }
  nav.main a { padding: 7px 9px; font-size: 14px; }
}
main { padding-block: 0 56px; }

/* ---------- opening sequence ---------- */
#intro { position: fixed; inset: 0; z-index: 80; background: #000; display: grid; place-items: center; }
#intro[hidden] { display: none !important; }
#intro .lock { text-align: center; opacity: 0; }
#intro .mono { font-family: var(--disp); font-weight: 700; font-size: clamp(66px, 19vw, 190px); line-height: .82; letter-spacing: .02em; color: #fff; }
#intro .mono i { font-style: normal; color: var(--ice); }
#intro .rule { height: 2px; background: var(--ice); margin: 14px auto 12px; width: 0; box-shadow: 0 0 22px rgba(111,197,255,.8); }
#intro .word { font-family: var(--disp); font-size: clamp(12px, 2.6vw, 19px); letter-spacing: .44em; text-transform: uppercase; color: #cfdcef; opacity: 0; }
#intro .crests { display: flex; gap: 10px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }
#intro .crests img, #intro .crests span { width: 38px; height: 38px; border-radius: 50%; background: #fff; object-fit: contain; padding: 3px; opacity: 0; transform: translateY(14px); }
#intro .skip { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); font-family: var(--disp); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.25); border-radius: 4px; padding: 6px 12px; background: none; cursor: pointer; }
#intro .skip:hover { color: #fff; border-color: #fff; }

/* ---------- film hero ---------- */
.film { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); background: #02040a; }
.film video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.film .shade { position: absolute; inset: 0; background:
  radial-gradient(120% 90% at 20% 10%, rgba(5,10,22,.22), rgba(3,5,11,.88) 76%),
  linear-gradient(180deg, rgba(3,5,11,.6), rgba(3,5,11,.2) 42%, var(--ink)); }
.film .in { position: relative; padding-block: clamp(54px, 13vw, 118px) clamp(28px, 6vw, 54px); }
.film h1 { font-size: clamp(42px, 11vw, 104px); line-height: .86; font-weight: 700; }
.film h1 em { font-style: normal; color: var(--ice); }
.film p.tag { max-width: 46ch; color: #c6d2e4; margin: 14px 0 0; font-size: clamp(15px, 2.1vw, 18px); }
.badge { display: inline-flex; align-items: center; gap: 8px; padding: 5px 11px; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; font-family: var(--disp); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #dbe6f6; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ice); box-shadow: 0 0 0 4px rgba(111,197,255,.2); }
.cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-family: var(--disp); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600;
  color: var(--fg); background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 5px; padding: 9px 15px; }
.btn:hover { background: rgba(255,255,255,.13); }
.btn.solid { background: var(--ice); color: #04121d; border-color: var(--ice); }
select { font-family: var(--body); font-size: 13px; color: var(--fg); background: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 6px 9px; }
:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }

/* ---------- game feature ---------- */
.gamecard { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #080c13; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
@media (max-width: 820px) { .gamecard { grid-template-columns: minmax(0, 1fr); } }
.gamecard .copy { padding: 22px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.gamecard h3 { font-size: clamp(30px, 5vw, 52px); line-height: .9; }
.shots { position: relative; min-height: 240px; background: #05080e; }
.shots img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .9s ease; }
.shots img.on { opacity: 1; }
.shots .edge { position: absolute; inset: 0; background: linear-gradient(90deg, #080c13 0%, rgba(8,12,19,0) 42%); }
@media (max-width: 820px) { .shots .edge { background: linear-gradient(180deg, #080c13 0%, rgba(8,12,19,0) 38%); } }

.feat { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); min-height: 230px; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; }
.feat img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; opacity: .62; }
.feat .vl { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,8,14,.15), rgba(5,8,14,.94)); }
.feat > * { position: relative; }
.feat h3 { font-size: clamp(22px, 3.3vw, 32px); line-height: .98; }
.feat .go { font-family: var(--disp); letter-spacing: .1em; font-size: 13px; color: var(--ice); margin-top: 10px; }
.feat:hover { border-color: var(--ice); }

/* ---------- panels + tables ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.phead { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--panel2); }
.phead h2 { font-size: 16px; font-weight: 700; letter-spacing: .07em; }
.phead .more { margin-left: auto; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ice); font-weight: 600; }
.sec { margin-top: 22px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 9px 10px; text-align: left; white-space: nowrap; }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
thead th { font-family: var(--disp); font-size: 12px; font-weight: 600; letter-spacing: .1em; color: var(--dim); border-bottom: 1px solid var(--line); background: var(--panel2); }
tbody tr { border-bottom: 1px solid rgba(156,180,214,.07); }
tbody tr:last-child { border-bottom: 0; }
tbody tr:hover { background: rgba(255,255,255,.03); }
.rank { color: var(--dim); width: 30px; }

.crest { width: 34px; height: 34px; flex: 0 0 auto; border-radius: 50%; background: #fff; object-fit: contain; padding: 3px; }
.crest.lg { width: 92px; height: 92px; padding: 7px; }
.crest.sm { width: 24px; height: 24px; padding: 2px; }
.monogram { display: grid; place-items: center; font-family: var(--disp); font-weight: 700; }
.tline { display: flex; align-items: center; gap: 9px; min-width: 0; }
.tline .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.abbr { font-family: var(--disp); font-weight: 600; letter-spacing: .05em; }
.pill { display: inline-block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(111,197,255,.15); color: var(--ice); }
.pill.gold { background: var(--gold); color: #2a1d00; }

/* ---------- team grid ---------- */
.teamgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
.tcard { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 14px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; text-align: center;
  opacity: 0; transform: translateY(14px) scale(.96); animation: pop .5s cubic-bezier(.22,1,.36,1) forwards; }
@keyframes pop { to { opacity: 1; transform: none; } }
.tcard::after { content: ""; position: absolute; inset: 0; border-radius: 10px; background: radial-gradient(70% 60% at 50% 0%, var(--tc), transparent 70%); opacity: .14; transition: opacity .25s; pointer-events: none; }
.tcard:hover::after { opacity: .32; }
.tcard:hover { border-color: var(--tc); transform: translateY(-3px); transition: transform .2s, border-color .2s; }
.tcard .crest { width: 72px; height: 72px; padding: 6px; transition: transform .3s cubic-bezier(.22,1,.36,1); }
.tcard:hover .crest { transform: scale(1.07) rotate(-3deg); }
.tcard h3 { font-size: 17px; line-height: 1; }
.tcard .sub { font-family: var(--disp); font-size: 13px; color: var(--dim); letter-spacing: .05em; }
.tcard .sd { position: absolute; top: 9px; left: 11px; font-family: var(--disp); font-size: 12px; color: var(--dim); }
#fx { position: fixed; inset: 0; z-index: 70; pointer-events: none; display: none; }
#fx .flood { position: absolute; inset: 0; background: var(--fxc, var(--ice)); }
#fx img, #fx span.mono { position: absolute; border-radius: 50%; background: #fff; object-fit: contain; padding: 4px; }

/* ---------- team page ---------- */
.thero { position: relative; overflow: hidden; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.thero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .35; }
.thero .in { position: relative; display: flex; align-items: center; gap: 18px; padding: 20px; flex-wrap: wrap;
  background: linear-gradient(100deg, color-mix(in srgb, var(--team) 80%, #04060b) 18%, color-mix(in srgb, var(--team) 14%, transparent)); }
.thero h1 { font-size: clamp(26px, 5.6vw, 46px); line-height: .92; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 1px; background: var(--line); }
.tile { background: var(--panel); padding: 12px 14px; }
.tile b { display: block; font-family: var(--disp); font-size: 26px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile span { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.cols { display: grid; gap: 14px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
@media (max-width: 880px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.jwrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 12px; padding: 14px; }
.jcard { text-align: center; }
.jcard svg { width: 100%; height: auto; max-width: 118px; }
.jcard .nm { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-weight: 600; margin-top: 6px; }
.remixshot { width: 100%; display: block; border-radius: 6px; }
.kitwrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; padding: 14px; }
.kitcard { margin: 0; }
.kitcard img { width: 100%; display: block; border-radius: 6px; border: 1px solid var(--line); background: #05080e; aspect-ratio: 4/5; object-fit: cover; }
.kitcard figcaption { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-weight: 600; margin-top: 6px; text-align: center; }

/* ---------- remix gallery ---------- */
.gal { display: grid; grid-template-columns: repeat(auto-fit, minmax(188px, 1fr)); gap: 12px; }
.gal a { position: relative; display: block; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #05080e; }
.gal img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 4/5; display: block; transition: transform .4s cubic-bezier(.22,1,.36,1); }
.gal a:hover img { transform: scale(1.04); }
.gal .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 12px 10px; display: flex; align-items: center; gap: 8px;
  background: linear-gradient(180deg, transparent, rgba(4,6,11,.92)); font-family: var(--disp); letter-spacing: .06em; }

/* ---------- march-madness bracket ---------- */
.mm { display: grid; grid-template-columns: 1fr 1fr 1.15fr 1fr 1fr; gap: 10px; align-items: center; }
.mmcol { display: grid; gap: 18px; }
.mmcol.semi { gap: 150px; }
.seedrow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13.5px; }
.seedrow + .seedrow { border-top: 1px solid rgba(156,180,214,.09); }
.seedrow .sd { font-family: var(--disp); font-size: 12px; color: var(--dim); width: 13px; text-align: center; }
.seedrow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.match { border: 1px solid var(--line); border-radius: 7px; background: var(--panel); position: relative; }
.match .tag { position: absolute; top: -9px; left: 10px; font-family: var(--disp); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); background: var(--ink); padding: 0 6px; }
.match .when { display: block; padding: 6px 10px 7px; border-top: 1px solid rgba(156,180,214,.09); font-size: 11px; letter-spacing: .04em; color: var(--dim); font-variant-numeric: tabular-nums; background: rgba(255,255,255,.015); }
.venuebar { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-bottom: 16px; }
.venuebar .vi { display: flex; flex-direction: column; gap: 2px; }
.venuebar .vi b { font-family: var(--disp); font-size: 17px; letter-spacing: .03em; }
.venuebar .vi span { font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--dim); }
.venuebar .sep { width: 1px; align-self: stretch; background: var(--line); }
@media (max-width: 620px) { .venuebar .sep { display: none; } }
/* connectors */
.match.l::after, .match.r::after { content: ""; position: absolute; top: 50%; width: 12px; border-top: 1px solid var(--line); }
.match.l::after { left: 100%; } .match.r::after { right: 100%; }
.mmcol.q .match.l::before, .mmcol.q .match.r::before { content: ""; position: absolute; width: 1px; background: var(--line); height: calc(50% + 9px); }
.mmcol.q .match.l:first-child::before { left: calc(100% + 12px); top: 50%; }
.mmcol.q .match.l:last-child::before { left: calc(100% + 12px); bottom: 50%; }
.mmcol.q .match.r:first-child::before { right: calc(100% + 12px); top: 50%; }
.mmcol.q .match.r:last-child::before { right: calc(100% + 12px); bottom: 50%; }
.final { border: 1px solid var(--gold); border-radius: 10px; background: linear-gradient(180deg, rgba(242,193,78,.12), var(--panel)); padding: 16px 12px; text-align: center; }
.final .cup { font-family: var(--disp); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.final .tbdline { font-family: var(--disp); font-size: 20px; color: var(--dim); margin-top: 8px; letter-spacing: .06em; }
.tbd { color: var(--dim); font-family: var(--disp); letter-spacing: .1em; text-transform: uppercase; font-size: 13px; padding: 14px 10px; text-align: center; }
@media (max-width: 900px) {
  .mm { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .mmcol.semi { gap: 14px; }
  .match.l::after, .match.r::after, .mmcol.q .match::before { display: none; }
}
footer { border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; padding-block: 18px 30px; margin-top: 34px; }
.loading { padding: 70px 0; text-align: center; color: var(--dim); font-family: var(--disp); letter-spacing: .18em; text-transform: uppercase; }
@media (prefers-reduced-motion: reduce) { .tcard { animation: none; opacity: 1; transform: none; } * { transition: none !important; } }
</style>
</head>
<body>


<header class="top">
  <div class="wrap topbar">
    <a class="mark" href="#home"><b>DHL</b><span>Davinky Hockey League</span></a>
    <nav class="main" id="nav"></nav>
  </div>
</header>
<main id="app"><div class="loading">Loading the league…</div></main>
<footer class="wrap"><div id="foot"></div></footer>
<div id="fx" aria-hidden="true"><div class="flood"></div></div>
<div id="intro" hidden>
  <div class="lock">
    <div class="mono">DH<i>L</i></div>
    <div class="rule"></div>
    <div class="word">Davinky Hockey League</div>
    <div class="crests" id="introCrests"></div>
  </div>
  <button class="skip" id="skipIntro" type="button">Skip</button>
</div>

<script>
(function () {
  const app = document.getElementById('app'), fx = document.getElementById('fx'), intro = document.getElementById('intro');
  const GAME_URL = 'https://lukemensink19-pixel.github.io/dhl27/play/';
  const ROUTES = [['home', 'Home'], ['standings', 'Standings'], ['teams', 'Teams'], ['players', 'Players'], ['classic', 'Remix Classic']];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let D, T = {};

  const crest = (id, cls) => {
    const t = T[id];
    if (!t.logo) return `<span class="crest ${cls || ''} monogram" style="background:${t.primary};color:${t.secondary};font-size:${cls === 'lg' ? 30 : cls === 'sm' ? 10 : 13}px">${esc(t.abbr)}</span>`;
    return `<img class="crest ${cls || ''}" src="assets/${t.logo}.jpg" alt="${esc(t.city + ' ' + t.name)} crest" loading="lazy">`;
  };
  const tline = (id, o = {}) => `<a class="tline" href="#team-${id}">${crest(id, o.sm ? 'sm' : '')}<span class="nm">${o.abbr ? `<span class="abbr">${esc(T[id].abbr)}</span>` : `<b>${esc(o.full ? T[id].city + ' ' + T[id].name : T[id].name)}</b>`}</span></a>`;
  const arenaImg = id => T[id].hasArenaImg ? `assets/arena-${id}.jpg` : null;
  const remixImg = id => `assets/remix-${id}.webp`;
  const paint = id => app.style.setProperty('--team', T[id].primary);
  const unpaint = () => app.style.setProperty('--team', 'var(--ice)');
  const tierOf = ovr => (D.tiers.find(t => ovr >= t[0]) || D.tiers[D.tiers.length - 1]);
  const diffColor = d => /^\+/.test(d) ? '#4ade80' : /^-/.test(d) ? '#f87171' : 'inherit';


  // ---------- views ----------
  const V = {};

  V.home = () => {
    unpaint();
    return `
      <section class="film">
        <video id="heroV" autoplay muted loop playsinline preload="auto"><source src="assets/hype-1.mp4" type="video/mp4"></video>
        <div class="shade"></div>
        <div class="wrap in">
          <span class="badge"><span class="dot"></span>2027 Season</span>
          <h1>Davinky<br>Hockey <em>League</em></h1>
          <p class="tag">Eight clubs. One cup. The league's record book, every roster, and the Hometown Remix Classic.</p>
          <div class="cta">
            <a class="btn solid" href="${GAME_URL}" target="_blank" rel="noopener">▶ Play DHL 27</a>
            <a class="btn" href="#classic">The Remix Classic</a>
            <a class="btn" href="#standings">Standings</a>
          </div>
        </div>
      </section>
      <div class="wrap">
        <div class="sec gamecard">
          <div class="copy">
            <div class="eyebrow">The Video Game</div>
            <h3>DHL 27</h3>
            <p class="small dim" style="margin:2px 0 0;max-width:40ch">Take any of the eight clubs onto the ice — real lines, real sweaters, penalties, overtime and the Cup. Runs in your browser.</p>
            <div class="cta" style="margin-top:14px"><a class="btn solid" href="${GAME_URL}" target="_blank" rel="noopener">▶ Play now</a></div>
          </div>
          <div class="shots" id="shots">
            <img src="assets/game-1.jpg" class="on" alt="Brockland celebrate a goal in their hometown remix sweaters">
            <img src="assets/game-2.jpg" alt="San Pedro celebrate a goal against Meridian">
            <img src="assets/game-3.jpg" alt="Garra Bay attack the San Pedro net">
            <div class="edge"></div>
          </div>
        </div>
        <a class="feat sec" href="#classic" style="display:flex">
          <img class="bg" src="${remixImg('bu')}" alt="">
          <div class="vl"></div>
          <div class="eyebrow">Upcoming · ${esc(D.classic.dates)} · ${esc(D.classic.venue.arena)}</div>
          <h3>adidas Hometown Remix Classic</h3>
          <p class="small dim" style="margin:6px 0 0;max-width:52ch">${esc(D.classic.blurb)}</p>
          <div class="go">See the bracket →</div>
        </a>
        <div class="sec panel">
          <div class="phead"><h2>Current Standings</h2><a class="more" href="#standings">Full table</a></div>
          <div class="scroll"><table>
            <thead><tr><th>Rnk</th><th>Team</th><th class="num">Pts.</th><th class="num">PF</th><th class="num">PA</th><th class="num">+/-</th><th class="num">Titles</th></tr></thead>
            <tbody>${D.standings.map(s => `<tr><td class="rank tnum">${s.rnk}</td><td>${tline(s.id, { sm: true })}</td>
              <td class="num"><b>${s.pts}</b></td><td class="num">${s.pf}</td><td class="num">${s.pa}</td>
              <td class="num" style="color:${diffColor(s.diff)}">${esc(s.diff)}</td><td class="num">${s.titles}</td></tr>`).join('')}</tbody></table></div>
        </div>
      </div>`;
  };

  V.standings = () => {
    unpaint();
    return `<div class="wrap" style="padding-top:22px">
      <div class="eyebrow" style="margin-bottom:8px">From the league record book</div>
      <div class="panel">
        <div class="phead"><h2>Standings</h2></div>
        <div class="scroll"><table>
          <thead><tr><th>Rnk</th><th>Team</th><th class="num">Pts.</th><th class="num">PF</th><th class="num">PA</th><th class="num">+/-</th><th class="num">Title Appearances</th><th class="num">Titles</th></tr></thead>
          <tbody>${D.standings.map(s => `<tr><td class="rank tnum">${s.rnk}</td><td>${tline(s.id, { sm: true, full: true })}</td>
            <td class="num"><b>${s.pts}</b></td><td class="num">${s.pf}</td><td class="num">${s.pa}</td>
            <td class="num" style="color:${diffColor(s.diff)}">${esc(s.diff)}</td>
            <td class="num">${s.apps}</td><td class="num"><b>${s.titles}</b></td></tr>`).join('')}</tbody></table></div>
      </div>
    </div>`;
  };

  V.teams = () => {
    unpaint();
    return `<div class="wrap" style="padding-top:22px">
      <div class="eyebrow" style="margin-bottom:12px">Eight clubs · tap a crest</div>
      <div class="teamgrid">
        ${D.teams.map((t, i) => `<a class="tcard" href="#team-${t.id}" data-team="${t.id}" style="--tc:${t.primary};animation-delay:${i * 55}ms">
          <span class="sd">${t.seed}</span>${crest(t.id)}
          <span><h3>${esc(t.city)}</h3><span class="sub">${esc(t.name)}</span></span>
        </a>`).join('')}
      </div>
    </div>`;
  };

  V.team = id => {
    const t = T[id]; if (!t) return V.teams();
    paint(id);
    const r = t.ratings, s = D.standings.find(x => x.id === id);
    const order = { C: 0, LW: 1, RW: 2, D: 3, G: 4 };
    const roster = t.roster.slice().sort((a, b) => order[a.pos] - order[b.pos] || b.ovr - a.ovr);
    return `<div class="wrap" style="padding-top:22px">
      <div class="thero">
        ${arenaImg(id) ? `<img class="bg" src="${arenaImg(id)}" alt="${esc(t.arena)}">` : ''}
        <div class="in">${crest(id, 'lg')}
          <div style="min-width:0">
            <div class="eyebrow" style="color:rgba(255,255,255,.82)">${esc(t.arena)}${t.capacity ? ` · ${esc(t.capacity)} seats` : ''}</div>
            <h1>${esc(t.city)}<br>${esc(t.name)}</h1>
            <div style="margin-top:6px"><span class="pill">#${s.rnk} in the league</span> ${s.titles ? `<span class="pill gold">${s.titles} ${s.titles === 1 ? 'title' : 'titles'}</span>` : ''}</div>
          </div>
          <div style="margin-left:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end">
            <div style="text-align:right"><div class="disp" style="font-size:44px;line-height:1">${r.ovr}</div><div class="eyebrow" style="color:rgba(255,255,255,.75)">Team rating</div></div>
            <a class="btn" href="#team-${id}" data-store="1">Team Store · Soon</a>
          </div>
        </div>
      </div>
      <div class="panel sec"><div class="tiles">
        ${tile(r.off, 'Offense')}${tile(r.def, 'Defense')}${tile(r.gk, 'Goalie')}
        ${tile(s.pts, 'Points')}${tile(s.pf + ' / ' + s.pa, 'PF / PA')}${tile(s.apps, 'Title appearances')}
      </div></div>
      <div class="cols sec">
        <div class="panel">
          <div class="phead"><h2>Roster</h2><span class="more dim">${roster.length} players</span></div>
          <div class="scroll"><table>
            <thead><tr><th class="num">#</th><th>Player</th><th class="num">OVR</th></tr></thead>
            <tbody>${roster.map(p => `<tr><td class="num rank">${p.num}</td>
              <td><b>${esc(p.name)}</b>${p.flag ? ' <span class="pill">Flagged</span>' : ''}</td>
              <td class="num"><b>${p.ovr}</b></td></tr>`).join('')}</tbody></table></div>
        </div>
        <div style="display:grid;gap:14px;align-content:start">
          <div class="panel"><div class="phead"><h2>Uniforms</h2><a class="more" href="#classic">The Classic</a></div>
            <div class="kitwrap">
              ${[['home', 'Home'], ['away', 'Away'], ['remix', 'Hometown Remix']].map(([k, label]) => t.shots && t.shots[k]
                ? `<figure class="kitcard"><img src="assets/${t.shots[k]}" alt="${esc(t.city)} ${esc(label)} uniform" loading="lazy"><figcaption>${esc(label)}</figcaption></figure>` : '').join('')}
            </div></div>
          <div class="panel"><div class="phead"><h2>Club Record</h2></div>
            <div class="scroll"><table><tbody>
              <tr><td>League rank</td><td class="num"><b>${s.rnk}</b></td></tr>
              <tr><td>Points</td><td class="num">${s.pts}</td></tr>
              <tr><td>Points for / against</td><td class="num">${s.pf} / ${s.pa}</td></tr>
              <tr><td>Goal differential</td><td class="num" style="color:${diffColor(s.diff)}">${esc(s.diff)}</td></tr>
              <tr><td>Title appearances</td><td class="num">${s.apps}</td></tr>
              <tr><td>Titles</td><td class="num"><b>${s.titles}</b></td></tr>
            </tbody></table></div></div>
        </div>
      </div>
    </div>`;
  };
  const tile = (v, l) => `<div class="tile"><b>${v}</b><span>${esc(l)}</span></div>`;

  let pTeam = 'ALL', pSort = 'ovr';
  V.players = () => {
    unpaint();
    let rows = [];
    for (const t of D.teams) if (pTeam === 'ALL' || t.id === pTeam) for (const p of t.roster) rows.push(Object.assign({ team: t.id }, p));
    rows.sort((a, b) => pSort === 'ovr' ? b.ovr - a.ovr || a.name.localeCompare(b.name)
      : pSort === 'num' ? a.num - b.num || a.name.localeCompare(b.name) : a.name.localeCompare(b.name));
    return `<div class="wrap" style="padding-top:22px">
      <div class="panel">
        <div class="phead"><h2>Players</h2><span class="more dim">${rows.length}</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--panel2)">
          <select id="teamSel"><option value="ALL">All clubs</option>${D.teams.map(t => `<option value="${t.id}" ${pTeam === t.id ? 'selected' : ''}>${esc(t.city)} ${esc(t.name)}</option>`).join('')}</select>
          <select id="sortSel">${[['ovr', 'Sort by overall'], ['num', 'Sort by number'], ['name', 'Sort by name']].map(([v, l]) => `<option value="${v}" ${pSort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        </div>
        <div class="scroll"><table>
          <thead><tr><th class="num">#</th><th>Name</th>${pTeam === 'ALL' ? '<th>Club</th>' : ''}<th class="num">OVR</th></tr></thead>
          <tbody>${rows.map(p => `<tr><td class="num rank">${p.num}</td><td><b>${esc(p.name)}</b></td>
            ${pTeam === 'ALL' ? `<td>${tline(p.team, { sm: true, abbr: true })}</td>` : ''}
            <td class="num"><b>${p.ovr}</b></td></tr>`).join('')}</tbody></table></div>
      </div>
    </div>`;
  };

  V.classic = () => {
    unpaint();
    const q = D.classic.quarters;
    const row = (id, seed) => `<a class="seedrow" href="#team-${id}"><span class="sd">${seed}</span>${crest(id, 'sm')}<span class="nm">${esc(T[id].city)}</span><span class="abbr dim" style="margin-left:auto">${esc(T[id].abbr)}</span></a>`;
    const match = (m, cap, side) => `<div class="match ${side}"><span class="tag">${esc(cap)}</span>${row(m.hi, m.hiSeed)}${row(m.lo, m.loSeed)}
      <span class="when">${esc(m.when)}</span></div>`;
    const C = D.classic, ven = C.venue || {};
    const dayOnly = s => String(s).replace(/^[A-Za-z]+,\s*/, '');
    return `<div class="wrap" style="padding-top:22px">
      <div class="thero">
        <img class="bg" src="${remixImg('gbu')}" alt="" style="object-position:center 18%">
        <div class="in"><div style="min-width:0">
          <div class="eyebrow" style="color:rgba(255,255,255,.82)">${esc(C.dates)} · ${esc(ven.arena || '')}</div>
          <h1>adidas Hometown<br>Remix Classic</h1>
          <p class="small" style="color:rgba(255,255,255,.9);max-width:52ch;margin:8px 0 0">${esc(C.blurb)}</p>
        </div></div>
      </div>

      <div class="sec venuebar">
        <div class="vi"><b>${esc(ven.arena || '')}</b><span>${esc(ven.city || '')}${ven.capacity ? ` · ${esc(ven.capacity)} seats` : ''}</span></div>
        <div class="sep"></div>
        <div class="vi"><b>${esc(C.dates)}</b><span>Three days</span></div>
        <div class="sep"></div>
        <div class="vi"><b>${esc(dayOnly(C.rounds.qf))}</b><span>Quarterfinals</span></div>
        <div class="vi"><b>${esc(dayOnly(C.rounds.sf))}</b><span>Semifinals</span></div>
        <div class="vi"><b>${esc(dayOnly(C.rounds.final))}</b><span>Final</span></div>
      </div>

      <div class="sec"><div class="eyebrow" style="margin-bottom:10px">The Bracket · seeded by the current standings</div>
        <div class="mm">
          <div class="mmcol q">${match(q[0], 'Quarterfinal 1', 'l')}${match(q[1], 'Quarterfinal 2', 'l')}</div>
          <div class="mmcol semi"><div class="match l"><span class="tag">Semifinal 1</span><div class="tbd">Winner QF 1</div><div class="tbd" style="border-top:1px solid rgba(156,180,214,.09)">Winner QF 2</div>
            <span class="when">${esc(C.semiTimes[0])}</span></div></div>
          <div class="mmcol"><div class="final"><div class="cup">The Classic Final</div>
            <div class="tbdline">TBD</div>
            <div class="small" style="margin-top:6px;color:var(--gold)">${esc(C.finalTime)}</div>
            <div class="small dim" style="margin-top:4px">${esc(ven.arena || '')} · single elimination</div></div></div>
          <div class="mmcol semi"><div class="match r"><span class="tag">Semifinal 2</span><div class="tbd">Winner QF 3</div><div class="tbd" style="border-top:1px solid rgba(156,180,214,.09)">Winner QF 4</div>
            <span class="when">${esc(C.semiTimes[1])}</span></div></div>
          <div class="mmcol q">${match(q[2], 'Quarterfinal 3', 'r')}${match(q[3], 'Quarterfinal 4', 'r')}</div>
        </div>
      </div>

      <div class="sec"><div class="eyebrow" style="margin-bottom:10px">The Sweaters</div>
        <div class="gal">${D.teams.map(t => `<a href="#team-${t.id}"><img src="${remixImg(t.id)}" alt="${esc(t.city)} ${esc(t.name)} hometown remix uniform" loading="lazy">
          <span class="cap">${crest(t.id, 'sm')}<b>${esc(t.city)}</b></span></a>`).join('')}</div></div>

      <div class="sec panel"><div class="phead"><h2>Format</h2></div>
        <div style="padding:14px;max-width:62ch;display:grid;gap:10px">
          <p style="margin:0">Single elimination, eight clubs, seeded one through eight off the current league standings — so Garra Bay opens against Lawson and San Pedro draws Alpine State.</p>
          <p style="margin:0">All three days run at ${esc(ven.arena || '')} in ${esc(ven.city || '')}${ven.note ? ` — ${esc(ven.note.toLowerCase())}` : ''}. Four quarterfinals ${esc(C.rounds.qf.toLowerCase())}, two semifinals ${esc(C.rounds.sf.toLowerCase())}, the final ${esc(C.rounds.final.toLowerCase())}.</p>
          <p style="margin:0" class="dim small">Every club wears its hometown remix sweater for the whole event. Results post here once the Classic is played.</p>
        </div></div>
    </div>`;
  };

  // ---------- crest transition ----------
  function burst(card, id, go) {
    if (reduce) return go();
    const img = card.querySelector('.crest'), r = img.getBoundingClientRect(), t = T[id];
    fx.style.display = 'block'; fx.style.setProperty('--fxc', t.primary);
    const flood = fx.querySelector('.flood'), clone = img.cloneNode(true);
    clone.style.cssText = `position:absolute;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;padding:6px`;
    fx.appendChild(clone);
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const far = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy));
    flood.animate([{ clipPath: `circle(0px at ${cx}px ${cy}px)` }, { clipPath: `circle(${far}px at ${cx}px ${cy}px)` }],
      { duration: 430, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
    const dx = innerWidth / 2 - cx, dy = Math.min(innerHeight / 2, 240) - cy;
    const a = clone.animate([
      { transform: 'translate(0,0) scale(1) rotate(0deg)' },
      { transform: `translate(${dx * .5}px, ${dy * .5}px) scale(1.9) rotate(-12deg)`, offset: .55 },
      { transform: `translate(${dx}px, ${dy}px) scale(2.5) rotate(0deg)` },
    ], { duration: 560, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });
    a.onfinish = () => {
      go();
      const out = fx.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 320, easing: 'ease-out', fill: 'forwards' });
      out.onfinish = () => { fx.style.display = 'none'; fx.getAnimations().forEach(x => x.cancel()); clone.remove(); flood.getAnimations().forEach(x => x.cancel()); };
    };
  }

  // ---------- opening sequence ----------
  function playIntro() {
    let seen = false; try { seen = sessionStorage.getItem('dhl.intro') === '1'; } catch (e) { }
    if (seen || reduce) return;
    intro.hidden = false;
    document.getElementById('introCrests').innerHTML = D.teams.map(t => t.logo
      ? `<img src="assets/${t.logo}.jpg" alt="">`
      : `<span style="display:grid;place-items:center;background:${t.primary};color:${t.secondary};font-family:var(--disp);font-weight:700;font-size:12px">${esc(t.abbr)}</span>`).join('');
    const lock = intro.querySelector('.lock'), mono = intro.querySelector('.mono'),
      rule = intro.querySelector('.rule'), word = intro.querySelector('.word'),
      cr = [...intro.querySelectorAll('#introCrests img, #introCrests span')];
    const E = 'cubic-bezier(.22,1,.36,1)';
    lock.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 260, fill: 'forwards' });
    mono.animate([{ transform: 'scale(1.55)', filter: 'blur(12px)', opacity: 0 }, { transform: 'scale(1)', filter: 'blur(0px)', opacity: 1 }],
      { duration: 900, delay: 260, easing: E, fill: 'forwards' });
    rule.animate([{ width: '0px' }, { width: 'min(300px, 62vw)' }], { duration: 700, delay: 900, easing: E, fill: 'forwards' });
    word.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 650, delay: 1050, easing: E, fill: 'forwards' });
    cr.forEach((c, i) => c.animate([{ opacity: 0, transform: 'translateY(16px) scale(.8)' }, { opacity: 1, transform: 'none' }],
      { duration: 520, delay: 1500 + i * 85, easing: E, fill: 'forwards' }));
    // black veil lifts off the rink film, then the whole lockup clears
    intro.animate([{ background: '#000' }, { background: 'rgba(2,4,9,.55)' }], { duration: 900, delay: 700, easing: 'ease-out', fill: 'forwards' });
    const end = intro.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 650, delay: 3250, easing: 'ease-in', fill: 'forwards' });
    lock.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }], { duration: 650, delay: 3250, easing: 'ease-in', fill: 'forwards' });
    end.onfinish = closeIntro;
    intro.addEventListener('click', closeIntro);
    document.getElementById('skipIntro').addEventListener('click', closeIntro);
  }
  function closeIntro() {
    if (intro.hidden) return;
    intro.getAnimations().forEach(a => a.cancel());
    intro.querySelectorAll('*').forEach(el => el.getAnimations().forEach(a => a.cancel()));
    intro.hidden = true;
    try { sessionStorage.setItem('dhl.intro', '1'); } catch (e) { }
  }

  // ---------- router ----------
  let shotTimer = null;
  function route() {
    const h = (location.hash || '#home').slice(1);
    app.innerHTML = h.startsWith('team-') ? V.team(h.slice(5)) : (V[h] || V.home)();
    document.querySelectorAll('#nav a').forEach(a => {
      const on = a.getAttribute('href') === '#' + (h.startsWith('team-') ? 'teams' : h);
      on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
    });
    wire();
    scrollTo(0, 0);
  }
  function wire() {
    app.querySelectorAll('.tcard').forEach(card => card.addEventListener('click', e => {
      e.preventDefault(); burst(card, card.dataset.team, () => { location.hash = 'team-' + card.dataset.team; });
    }));
    const ts = document.getElementById('teamSel'), ss = document.getElementById('sortSel');
    if (ts) ts.onchange = e => { pTeam = e.target.value; route(); };
    if (ss) ss.onchange = e => { pSort = e.target.value; route(); };
    app.querySelectorAll('[data-store]').forEach(b => b.addEventListener('click', e => {
      e.preventDefault(); b.textContent = 'Store opens soon'; setTimeout(() => { b.textContent = 'Team Store · Soon'; }, 1600);
    }));
    clearInterval(shotTimer); shotTimer = null;
    const shots = document.getElementById('shots');
    if (shots && !reduce) {
      const imgs = [...shots.querySelectorAll('img')]; let i = 0;
      shotTimer = setInterval(() => { imgs[i].classList.remove('on'); i = (i + 1) % imgs.length; imgs[i].classList.add('on'); }, 3600);
    }
  }

  fetch('league.json').then(r => r.json()).then(data => {
    D = data; D.teams.forEach(t => T[t.id] = t);
    document.getElementById('nav').innerHTML = ROUTES.map(([k, l]) => `<a href="#${k}">${l}</a>`).join('');
    document.getElementById('foot').innerHTML =
      `Davinky Hockey League · standings, ratings and rosters from the league document · <a href="${GAME_URL}" target="_blank" rel="noopener" style="color:var(--ice)">Play DHL 27 →</a>`;
    route();
    if (!location.hash || location.hash === '#home') playIntro();
    addEventListener('hashchange', route);
  }).catch(e => { app.innerHTML = `<div class="loading">Could not load the league data.<br><span class="small">${esc(e.message)}</span></div>`; });
})();
</script>

</body>
</html>
