  };

  // ---------- team store ----------
  // Every jersey photo was framed differently, so each face is positioned from the
  // silhouette box measured at build time. That makes the front and the back of the
  // 3D card the same on-screen garment, and lets the name and number sit on fabric.
  const SLOT_A = 0.86;                       // slot width / slot height
  const KITS = [['home', 'Home'], ['away', 'Away'], ['remix', 'Hometown Remix']];
  let shopTeam = null, shopKit = 'home', shopPlayer = null, shopQuery = '', shopRot = 0, shopAim = 0, shopSpin = true;

  // Where the garment lands inside a slot, in slot-height units.
  function layout(box) {
    const R = box.iw / box.ih;
    const hi = Math.min(.96 * SLOT_A / (box.w * R), .96 / box.h);
    const wi = hi * R, gw = box.w * wi, gh = box.h * hi;
    const left = SLOT_A / 2 - (box.x + box.w / 2) * wi, top = .5 - (box.y + box.h / 2) * hi;
    const pw = v => (v / SLOT_A * 100).toFixed(3) + '%', ph = v => (v * 100).toFixed(3) + '%';
    return {
      css: `left:${pw(left)};top:${ph(top)};width:${pw(wi)};height:${ph(hi)}`,
      g: { x: (SLOT_A - gw) / 2, y: (1 - gh) / 2, w: gw, h: gh }, pw, ph,
    };
  }

  // Twill name bar and number, drawn as SVG so the outline stays crisp at any size.
  function twill(L, plate, last, num) {
    const { g, pw, ph } = L, out = [];
    const rect = (x, y, w, h) => `left:${pw(x)};top:${ph(y)};width:${pw(w)};height:${ph(h)}`;
    if (last) {
      const w = g.w * .58, h = w / 7 / SLOT_A, fs = Math.min(104, 640 / Math.max(2, last.length * .72));
      out.push(`<div class="plate" style="${rect(g.x + (g.w - w) / 2, g.y + g.h * .212, w, h)}">
        <svg viewBox="0 0 700 100" preserveAspectRatio="xMidYMid meet"><text x="350" y="87" font-size="${fs.toFixed(1)}"
          letter-spacing="${(fs * .06).toFixed(1)}" fill="${plate.fill}" stroke="${plate.edge}" stroke-width="${(fs * .07).toFixed(1)}"
        >${esc(last.toUpperCase())}</text></svg></div>`);
    }
    if (num != null) {
      const h = g.h * .255, w = h * 1.5 * SLOT_A;
      out.push(`<div class="plate" style="${rect(g.x + (g.w - w) / 2, g.y + g.h * .318, w, h)}">
        <svg viewBox="0 0 150 100" preserveAspectRatio="xMidYMid meet"><text x="75" y="90" font-size="112"
          fill="${plate.fill}" stroke="${plate.edge}" stroke-width="8">${esc(String(num))}</text></svg></div>`);
    }
    return out.join('');
  }

  const lastName = p => p.name.trim().split(/\s+/).pop();
  const money = n => '$' + n.toFixed(2);

  function jerseyCard(t, kit, interactive) {
    const fb = t.boxes[kit], front = t.fronts[kit];
    const Lf = layout(fb.front), Lb = layout(fb.back), p = t.plates[kit];
    const label = KITS.find(k => k[0] === kit)[1];
    const plate = interactive && shopPlayer ? twill(Lb, p, lastName(shopPlayer), shopPlayer.num) : '';
    const spin = interactive && shopSpin && !reduce ? ' spin' : '';
    return `<div class="jersey${spin}" style="--rot:${shopRot}deg">
      <div class="face f"><img src="assets/${front}" style="${Lf.css}" alt="${esc(t.city)} ${esc(label)} jersey, front"></div>
      <div class="face b"><img src="assets/${t.backs[kit]}" style="${Lb.css}" alt="${esc(t.city)} ${esc(label)} jersey, back">${plate}</div>
    </div>`;
  }

  V.shop = () => {
    unpaint();
    return `<div class="shophead"><div class="wrap"><div class="in">
        <div><div class="eyebrow">Official league shop</div><h1>Pick your club</h1></div>
        <a class="back" href="#teams">All teams →</a>
      </div></div></div>
      <div class="wrap" style="padding-top:18px">
        <div class="shopgrid">
          ${D.teams.map((t, i) => `<a class="scard" href="#shop-${t.id}" data-shop="${t.id}" style="--tc:${t.primary};animation-delay:${i * 50}ms">
            ${crest(t.id, 'lg')}
            <span><h3>${esc(t.city)}</h3><span class="sub eyebrow">${esc(t.name)}</span></span>
          </a>`).join('')}
        </div>
        <p class="small dim" style="margin-top:16px">Jerseys first. Hats, hoodies and pucks are next.</p>
      </div>`;
  };

  V.store = id => {
    const t = T[id]; if (!t) return V.shop();
    if (shopTeam !== id) { shopTeam = id; shopKit = 'home'; shopPlayer = null; shopQuery = ''; shopRot = shopAim = 0; shopSpin = true; }
    paint(id);
    const roster = t.roster.slice().sort((a, b) => a.num - b.num);
    const q = shopQuery.trim().toLowerCase();
    const shown = q ? roster.filter(p => p.name.toLowerCase().includes(q) || String(p.num) === q) : roster;
    const ki = KITS.findIndex(k => k[0] === shopKit);
    const base = D.store.price[shopKit], total = base + (shopPlayer ? D.store.customPrice : 0);
    return `<div class="shophead"><div class="wrap"><div class="in">
        ${crest(id, 'lg')}
        <div style="min-width:0"><div class="eyebrow">Official team store</div><h1>${esc(t.city)} ${esc(t.name)}</h1></div>
        <a class="back" href="#shop">All stores →</a>
      </div></div></div>
      <div class="wrap shopmain">
        <div>
          <div class="stage" id="stage"><div class="gl"></div><div class="rail">
            ${KITS.map(([k], i) => `<div class="slot${i === ki ? ' o0' : ''}"${i === ki ? '' : ` data-off="${i - ki}"`} data-kit="${k}">${jerseyCard(t, k, i === ki)}</div>`).join('')}
          </div>
            <button class="navarrow prev" type="button" data-step="-1" aria-label="Previous jersey"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
            <button class="navarrow next" type="button" data-step="1" aria-label="Next jersey"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
          </div>
          <div class="stagebar">
            <button class="sbtn" type="button" data-face="front">Front</button>
            <button class="sbtn" type="button" data-face="back">Back</button>
            <button class="sbtn" type="button" id="spinBtn" aria-pressed="${shopSpin}">Auto-spin</button>
            <span class="small dim" style="margin-left:4px">Drag the jersey to turn it</span>
          </div>
        </div>
        <aside class="buybox">
          <div class="kittabs">
            ${KITS.map(([k, label]) => `<button class="kittab" type="button" data-kit="${k}" aria-pressed="${k === shopKit}">
              <b>${esc(label === 'Hometown Remix' ? 'Remix' : label)}</b><span>${money(D.store.price[k])}</span></button>`).join('')}
          </div>
          <div class="eyebrow">Authentic Pro · adidas</div>
          <h2>${esc(KITS[ki][1])} Jersey</h2>
          <div class="price">${money(total)}${shopPlayer ? `<s>${money(base)} blank</s>` : ''}</div>
          <div class="custom">
            <div class="eyebrow">Customize · +${money(D.store.customPrice)}</div>
            <input class="psearch" id="pq" type="search" placeholder="Search the roster" value="${esc(shopQuery)}" autocomplete="off">
            <div class="plist">
              <button class="prow" type="button" data-player="" aria-pressed="${!shopPlayer}"><span class="n">—</span><span>Blank · no customization</span></button>
              ${shown.map(p => `<button class="prow" type="button" data-player="${p.num}|${esc(p.name)}" aria-pressed="${shopPlayer && shopPlayer.num === p.num && shopPlayer.name === p.name}">
                <span class="n">${p.num}</span><span>${esc(p.name)}</span><span class="o">${p.ovr}</span></button>`).join('')}
              ${shown.length ? '' : '<div class="prow dim">No player by that name.</div>'}
            </div>
            ${shopPlayer ? `<p class="fineprint">Back of the sweater: <b>${esc(lastName(shopPlayer).toUpperCase())}</b> · <b>${shopPlayer.num}</b></p>` : ''}
          </div>
          <button class="bag" type="button" id="bagBtn">Add to bag</button>
          <p class="fineprint">Customized sweaters are final sale. Prices are part of the DHL fan project and nothing here actually ships.</p>
        </aside>
      </div>`;
  };

  // The crest transition into a storefront: black, then the mark turns and floods out.
  function storeBurst(card, id, go) {
    if (reduce) return go();
    const mark = card.querySelector('.crest'), r = mark.getBoundingClientRect(), t = T[id];
    sx.hidden = false;
    const clone = mark.cloneNode(true);
    clone.classList.add('sxc'); clone.classList.remove('crest', 'lg');
    clone.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;font-size:${r.width * .38}px`;
    sx.appendChild(clone);
    const ring = sx.querySelector('.ring');
    const cx = innerWidth / 2, cy = Math.min(innerHeight / 2, 340);
    const far = Math.hypot(innerWidth, innerHeight) * 1.1;
    ring.style.cssText = `left:${cx}px;top:${cy}px;border-color:${t.primary}`;
    sx.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240, easing: 'ease-out', fill: 'forwards' });
    ring.animate([
      { width: 0, height: 0, margin: '0', opacity: 0, offset: 0 },
      { opacity: .9, offset: .25 },
      { width: far + 'px', height: far + 'px', margin: `${-far / 2}px 0 0 ${-far / 2}px`, opacity: 0 },
    ], { duration: 900, delay: 320, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
    const a = clone.animate([
      { transform: 'translate(0,0) rotateY(0deg) scale(1)', opacity: 1 },
      { transform: `translate(${cx - r.left - r.width / 2}px,${cy - r.top - r.height / 2}px) rotateY(360deg) scale(3.2)`, opacity: 1, offset: .62 },
      { transform: `translate(${cx - r.left - r.width / 2}px,${cy - r.top - r.height / 2}px) rotateY(540deg) scale(10)`, opacity: 0 },
    ], { duration: 1080, easing: 'cubic-bezier(.5,0,.22,1)', fill: 'forwards' });
    a.onfinish = () => {
      go();
      const out = sx.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, easing: 'ease-out', fill: 'forwards' });
      out.onfinish = () => {
        sx.hidden = true; clone.remove();
        sx.getAnimations().forEach(x => x.cancel()); ring.getAnimations().forEach(x => x.cancel());
      };
    };
  }

  // Re-render only the stage and the buy box, so typing in the search keeps focus.
  function redrawStore() {
    const keep = document.activeElement, atSearch = keep && keep.id === 'pq', caret = atSearch ? keep.selectionStart : 0;
    app.innerHTML = V.store(shopTeam);
    wire();
    if (atSearch) { const f = document.getElementById('pq'); if (f) { f.focus(); try { f.setSelectionRange(caret, caret); } catch (e) { } } }
  }

  function setRot(deg, animate) {
    const j = app.querySelector('.slot.o0 .jersey'); if (!j) return;
    shopRot = JV.ok ? shopRot : deg; shopAim = deg; shopSpin = false;
    j.classList.remove('spin');
    j.classList.toggle('anim', !!animate);
    j.style.setProperty('--rot', deg + 'deg');
    const b = document.getElementById('spinBtn'); if (b) b.setAttribute('aria-pressed', 'false');
  }

  function wireStore() {
    const stage = document.getElementById('stage'); if (!stage) return;
    stage.querySelectorAll('.slot').forEach(s => s.addEventListener('click', e => {
      if (s.classList.contains('o0') || s.dataset.dragged) return;
      shopKit = s.dataset.kit; shopRot = shopAim = 0; shopSpin = true; redrawStore();
    }));
    app.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
      const ki = KITS.findIndex(k => k[0] === shopKit);
      shopKit = KITS[(ki + Number(b.dataset.step) + KITS.length) % KITS.length][0];
      shopRot = shopAim = 0; shopSpin = true; redrawStore();
    }));
    app.querySelectorAll('.kittab').forEach(b => b.addEventListener('click', () => {
      shopKit = b.dataset.kit; shopRot = shopAim = 0; shopSpin = true; redrawStore();
    }));
    app.querySelectorAll('[data-face]').forEach(b => b.addEventListener('click', () => {
      const turns = Math.round(shopRot / 360);
      setRot(turns * 360 + (b.dataset.face === 'back' ? 180 : 0), true);
    }));
    const sb = document.getElementById('spinBtn');
    if (sb) sb.addEventListener('click', () => {
      shopSpin = !shopSpin; shopRot = JV.ok ? shopRot : 0; shopAim = shopRot;
      const j = app.querySelector('.slot.o0 .jersey');
      sb.setAttribute('aria-pressed', String(shopSpin));
      if (!j) return;
      j.classList.remove('anim');
      j.style.setProperty('--rot', '0deg');
      j.classList.toggle('spin', shopSpin && !reduce);
    });
    const q = document.getElementById('pq');
    if (q) q.addEventListener('input', e => { shopQuery = e.target.value; redrawStore(); });
    app.querySelectorAll('[data-player]').forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.player;
      if (!v) { shopPlayer = null; shopRot = shopAim = 0; shopSpin = true; redrawStore(); return; }
      const [num, ...rest] = v.split('|');
      shopPlayer = { num: +num, name: rest.join('|') };
      shopSpin = false;                            // one full turn, settling on the back
      shopAim = JV.ok ? Math.round(shopRot / 360) * 360 + 540 : 540;
      if (!JV.ok) shopRot = 540;
      redrawStore();
      const j = app.querySelector('.slot.o0 .jersey');
      if (j && !reduce) { j.style.setProperty('--rot', '180deg'); requestAnimationFrame(() => { j.classList.add('anim'); j.style.setProperty('--rot', '540deg'); }); }
    }));
    const bag = document.getElementById('bagBtn');
    if (bag) bag.addEventListener('click', () => {
      const was = bag.textContent;
      bag.textContent = 'Checkout coming soon';
      setTimeout(() => { bag.textContent = was; }, 1700);
    });
    const host = stage.querySelector('.gl');
    if (host) JV.mount(host, T[shopTeam], shopPlayer);

    // drag the centre jersey to turn it
    const centre = stage.querySelector('.slot.o0');
    if (centre) {
      let id0 = null, x0 = 0, r0 = 0, moved = false;
      centre.addEventListener('pointerdown', e => {
        id0 = e.pointerId; x0 = e.clientX; r0 = shopRot; moved = false;
        centre.setPointerCapture(id0); centre.classList.add('drag');
        const j = centre.querySelector('.jersey');
        if (j) { j.classList.remove('spin', 'anim'); j.style.setProperty('--rot', shopRot + 'deg'); }
        shopSpin = false;
        const b = document.getElementById('spinBtn'); if (b) b.setAttribute('aria-pressed', 'false');
      });
      centre.addEventListener('pointermove', e => {
        if (e.pointerId !== id0) return;
        const dx = e.clientX - x0;
        if (Math.abs(dx) > 4) moved = true;
        shopRot = r0 + dx * .7; shopAim = shopRot;
        const j = centre.querySelector('.jersey'); if (j) j.style.setProperty('--rot', shopRot + 'deg');
      });
      const end = e => {
        if (e.pointerId !== id0) return;
        id0 = null; centre.classList.remove('drag');
        if (moved) { centre.dataset.dragged = '1'; setTimeout(() => { delete centre.dataset.dragged; }, 0); }
        setRot(Math.round(shopRot / 180) * 180, true);   // snap to the nearest face
      };
      centre.addEventListener('pointerup', end);
      centre.addEventListener('pointercancel', end);
    }
  }

  // ---------- the 3D jersey stage ----------
  // All three sweaters are one WebGL scene, so the carousel is a single lit shot
  // rather than a 3D model flanked by two photographs on little black cards.
  //
  // assets/jersey.glb is a real hockey sweater (image-to-3D, cleaned up and resampled
  // by league/decimate.mjs). It has no texture of its own: the shader projects each
  // club's own front and back photographs down the Z axis through the silhouette
  // boxes measured at build time. The name and number are painted into the back
  // photo first, so they curve over the shoulders with the fabric.
  const JV = {
    ok: false, ready: null, geo: null, slots: [], ren: null, scene: null, cam: null,
    imgs: new Map(), shades: new Map(), frame: 0, last: 0, host: null, kill: [],

    lib() {
      if (window.DHL3D) return Promise.resolve(window.DHL3D);
      if (JV.ready) return JV.ready;
      JV.ready = new Promise((res, rej) => {
        const t = setTimeout(() => rej(new Error('three.js did not load')), 12000);
        addEventListener('dhl3d', () => { clearTimeout(t); res(window.DHL3D); }, { once: true });
        addEventListener('dhl3dfail', () => { clearTimeout(t); rej(new Error('three.js failed')); }, { once: true });
      });
      return JV.ready;
    },

    material(THREE) {
      return new THREE.ShaderMaterial({
        uniforms: {
          front: { value: null }, back: { value: null },
          fBox: { value: new THREE.Vector4() }, bBox: { value: new THREE.Vector4() },
          bbMin: { value: new THREE.Vector3() }, bbSize: { value: new THREE.Vector3(1, 1, 1) },
          lightDir: { value: new THREE.Vector3(.35, .5, 1).normalize() },
          tint: { value: 1 },
        },
        vertexShader: [
          'varying vec3 vPos; varying vec3 vN;',
          'void main(){ vPos = position; vN = normalize(normalMatrix * normal);',
          '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
        ].join('\n'),
        fragmentShader: [
          'uniform sampler2D front; uniform sampler2D back;',
          'uniform vec4 fBox; uniform vec4 bBox; uniform vec3 bbMin; uniform vec3 bbSize;',
          'uniform vec3 lightDir; uniform float tint;',
          'varying vec3 vPos; varying vec3 vN;',
          'void main(){',
          '  float u = (vPos.x - bbMin.x) / bbSize.x;',
          '  float v = (vPos.y - bbMin.y) / bbSize.y;',
          '  vec3 cf = texture2D(front, vec2(fBox.x + u * fBox.z, fBox.y + v * fBox.w)).rgb;',
          '  vec3 cb = texture2D(back,  vec2(bBox.x + (1.0 - u) * bBox.z, bBox.y + v * bBox.w)).rgb;',
          '  vec3 c = mix(cb, cf, smoothstep(-0.018, 0.018, vPos.z));',
          '  float lam = 0.64 + 0.36 * max(dot(normalize(vN), lightDir), 0.0);',
          '  gl_FragColor = vec4(c * lam * tint, 1.0);',
          '  #include <colorspace_fragment>',
          '}',
        ].join('\n'),
      });
    },

    async build() {
      const { THREE, GLTFLoader } = await JV.lib();
      if (JV.scene) return THREE;
      const ren = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      ren.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      ren.domElement.style.cssText = 'width:100%;height:100%;display:block';
      const scene = new THREE.Scene();
      const cam = new THREE.PerspectiveCamera(30, 1, .1, 50);
      cam.position.set(0, 0, 2.18);
      scene.add(new THREE.AmbientLight(0xffffff, 1.45));
      const key = new THREE.DirectionalLight(0xffffff, 1.55); key.position.set(2.5, 3, 4); scene.add(key);
      const fill = new THREE.DirectionalLight(0xffffff, 1.0); fill.position.set(-2.5, 1, -3.5); scene.add(fill);
      const rim = new THREE.DirectionalLight(0xffffff, .5); rim.position.set(0, -2, 1.5); scene.add(rim);

      const gltf = await new GLTFLoader().loadAsync('assets/jersey.glb');
      let src = null; gltf.scene.traverse(o => { if (o.isMesh) src = o; });
      if (!src) throw new Error('no mesh in jersey.glb');
      src.geometry.computeVertexNormals();
      src.geometry.computeBoundingBox();
      const bb = src.geometry.boundingBox;
      JV.geo = src.geometry;

      JV.slots = KITS.map(() => {
        const pivot = new THREE.Group();
        const m = new THREE.Mesh(JV.geo, JV.material(THREE));
        m.material.uniforms.bbMin.value.copy(bb.min);
        m.material.uniforms.bbSize.value.copy(bb.max.clone().sub(bb.min));
        pivot.add(m); scene.add(pivot);
        return { pivot, mesh: m };
      });
      Object.assign(JV, { ren, scene, cam, ok: true });
      return THREE;
    },

    image(file) {
      if (!JV.imgs.has(file)) JV.imgs.set(file, new Promise((res, rej) => {
        const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = 'assets/' + file;
      }));
      return JV.imgs.get(file);
    },

    // ---- twill ----
    // Lettering drawn flat on top of a photograph reads as a sticker. Real twill is
    // cut fabric sewn on: it sits in the same light as the sweater, creases where the
    // sweater creases, and casts a small contact shadow. So the glyphs are painted on
    // their own layer, the jersey's own light and folds are overlaid through them,
    // and the layer goes down with a soft shadow under it.
    CAP: .72,

    cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; },

    // A neutral-grey picture of just the fabric's shading: mid-grey where the jersey
    // is its own average brightness, lighter on a highlight, darker in a crease. Low
    // resolution on purpose — folds are broad, and this runs per kit.
    shadeOf(img) {
      if (JV.shades.has(img)) return JV.shades.get(img);
      const W = 256, H = Math.max(2, Math.round(img.naturalHeight / img.naturalWidth * W));
      const c = JV.cv(W, H), g = c.getContext('2d', { willReadFrequently: true });
      g.drawImage(img, 0, 0, W, H);
      const d = g.getImageData(0, 0, W, H), p = d.data, n = W * H;
      const lum = new Float32Array(n);
      for (let i = 0; i < n; i++) lum[i] = .299 * p[i * 4] + .587 * p[i * 4 + 1] + .114 * p[i * 4 + 2];
      const mean = JV.blur(JV.blur(lum, W, H, 9), W, H, 9);
      for (let i = 0; i < n; i++) {
        const v = Math.max(0, Math.min(255, 128 + (lum[i] - mean[i]) * 1.15));
        p[i * 4] = p[i * 4 + 1] = p[i * 4 + 2] = v; p[i * 4 + 3] = 255;
      }
      g.putImageData(d, 0, 0);
      JV.shades.set(img, c);
      return c;
    },

    blur(src, W, H, r) {
      const tmp = new Float32Array(W * H), out = new Float32Array(W * H), k = r * 2 + 1;
      for (let y = 0; y < H; y++) {
        let sum = 0;
        for (let x = -r; x <= r; x++) sum += src[y * W + Math.min(W - 1, Math.max(0, x))];
        for (let x = 0; x < W; x++) {
          tmp[y * W + x] = sum / k;
          sum += src[y * W + Math.min(W - 1, x + r + 1)] - src[y * W + Math.max(0, x - r)];
        }
      }
      for (let x = 0; x < W; x++) {
        let sum = 0;
        for (let y = -r; y <= r; y++) sum += tmp[Math.min(H - 1, Math.max(0, y)) * W + x];
        for (let y = 0; y < H; y++) {
          out[y * W + x] = sum / k;
          sum += tmp[Math.min(H - 1, y + r + 1) * W + x] - tmp[Math.max(0, y - r) * W + x];
        }
      }
      return out;
    },

    // paint(ctx) strokes and fills the glyphs; they come back carrying the fabric.
    stitch(g, w, h, shade, paint, lift) {
      const glyph = JV.cv(w, h), gg = glyph.getContext('2d');
      paint(gg);
      const lit = JV.cv(w, h), lg = lit.getContext('2d');
      lg.drawImage(glyph, 0, 0);
      lg.globalCompositeOperation = 'overlay';
      lg.drawImage(shade, 0, 0, w, h);
      lg.globalCompositeOperation = 'destination-in';
      lg.drawImage(glyph, 0, 0);
      g.save();
      g.shadowColor = 'rgba(0,0,0,.45)';
      g.shadowBlur = Math.max(2, lift * .5);
      g.shadowOffsetY = Math.max(1, lift * .22);
      g.drawImage(lit, 0, 0);
      g.restore();
    },

    font(g, px) { g.font = '400 ' + px + 'px "Archivo Black", "Arial Black", sans-serif'; },

    // widest the text may be, shrinking the face rather than squashing the letters
    fit(g, text, maxW, cap) {
      let fs = cap / JV.CAP;
      JV.font(g, fs);
      const w = g.measureText(text).width;
      if (w > maxW) { fs *= maxW / w; JV.font(g, fs); }
      return fs;
    },

    // The back photo with the player's name and number sewn on.
    async backCanvas(t, kit, player) {
      const img = await JV.image(t.backs[kit]);
      const c = JV.cv(img.naturalWidth, img.naturalHeight), g = c.getContext('2d');
      g.drawImage(img, 0, 0);
      if (!player) return c;
      const b = t.boxes[kit].back, p = t.plates[kit];
      const gx = b.x * c.width, gy = b.y * c.height, gw = b.w * c.width, gh = b.h * c.height;
      const cx = gx + gw / 2;
      const last = lastName(player).toUpperCase();
      JV.stitch(g, c.width, c.height, JV.shadeOf(img), gg => {
        gg.textAlign = 'center'; gg.textBaseline = 'alphabetic';
        gg.lineJoin = 'round'; gg.miterLimit = 2;
        gg.fillStyle = p.fill; gg.strokeStyle = p.edge;
        const fsN = JV.fit(gg, last, gw * .62, gh * .055);
        try { gg.letterSpacing = (fsN * .06).toFixed(1) + 'px'; } catch (e) { }
        JV.font(gg, fsN);
        const nameY = gy + gh * .205 + fsN * JV.CAP;
        gg.lineWidth = fsN * .15;
        gg.strokeText(last, cx, nameY); gg.fillText(last, cx, nameY);
        try { gg.letterSpacing = '0px'; } catch (e) { }
        const fsD = JV.fit(gg, String(player.num), gw * .5, gh * .235);
        const numY = gy + gh * .318 + fsD * JV.CAP;
        gg.lineWidth = fsD * .085;
        gg.strokeText(String(player.num), cx, numY); gg.fillText(String(player.num), cx, numY);
      }, gh * .02);
      return c;
    },

    // The front photo, which now ships without sleeve numbers, with the selected
    // player's number sewn onto both sleeves where the kit wore its own.
    async frontCanvas(t, kit, player) {
      const img = await JV.image(t.fronts[kit]);
      const c = JV.cv(img.naturalWidth, img.naturalHeight), g = c.getContext('2d');
      g.drawImage(img, 0, 0);
      const sl = t.sleeves && t.sleeves[kit];
      if (!player || !sl) return c;
      const b = t.boxes[kit].front, p = t.plates[kit];
      const gx = b.x * c.width, gy = b.y * c.height, gw = b.w * c.width, gh = b.h * c.height;
      const num = String(player.num);
      const boxW = sl.w * gw, boxH = sl.h * gh;
      // The kits wore their numbers right out on the sleeve, where projecting a flat
      // photo onto a round sleeve foreshortens them into the silhouette. Sitting them
      // a little inboard keeps them on fabric that faces the camera.
      const IN = .042;
      const left = gx + (sl.x + IN) * gw, right = gx + (1 - sl.x - sl.w - IN) * gw;   // mirrored
      JV.stitch(g, c.width, c.height, JV.shadeOf(img), gg => {
        gg.textAlign = 'center'; gg.textBaseline = 'alphabetic';
        gg.lineJoin = 'round'; gg.miterLimit = 2;
        gg.fillStyle = p.fill; gg.strokeStyle = p.edge;
        const fs = JV.fit(gg, num, boxW * 1.02, boxH * .94);
        gg.lineWidth = fs * .1;
        const baseY = gy + (sl.y + sl.h / 2) * gh + fs * JV.CAP / 2;
        for (const x of [left + boxW / 2, right + boxW / 2]) {
          gg.strokeText(num, x, baseY); gg.fillText(num, x, baseY);
        }
      }, boxH * .06);
      return c;
    },

    // A generated garment never traces the photographed one exactly, so sample a
    // little inside the silhouette: the model's edge then lands on fabric rather
    // than the black the jersey was shot against.
    boxOf(THREE, b) {
      const I = .028;
      return new THREE.Vector4(b.x + b.w * I, (1 - b.y - b.h) + b.h * I, b.w * (1 - I * 2), b.h * (1 - I * 2));
    },

    async skin(t, player) {
      const THREE = (await JV.lib()).THREE;
      JV.kill.forEach(x => x.dispose()); JV.kill = [];
      await Promise.all(KITS.map(async ([kit], i) => {
        const [fCan, bCan] = await Promise.all([JV.frontCanvas(t, kit, player), JV.backCanvas(t, kit, player)]);
        const u = JV.slots[i].mesh.material.uniforms;
        const fT = new THREE.CanvasTexture(fCan); fT.colorSpace = THREE.SRGBColorSpace;
        const bT = new THREE.CanvasTexture(bCan); bT.colorSpace = THREE.SRGBColorSpace;
        fT.anisotropy = bT.anisotropy = JV.ren.capabilities.getMaxAnisotropy();
        u.front.value = fT; u.back.value = bT;
        u.fBox.value.copy(JV.boxOf(THREE, t.boxes[kit].front));
        u.bBox.value.copy(JV.boxOf(THREE, t.boxes[kit].back));
        JV.kill.push(fT, bT);
      }));
    },

    // Coverflow, in world units: the chosen sweater square on, the others turned
    // away and pushed back. How far out they sit depends on how wide the stage is.
    layout() {
      if (!JV.ok || !JV.host) return;
      const r = JV.host.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const halfW = Math.tan(JV.cam.fov * Math.PI / 360) * JV.cam.position.z * (r.width / r.height);
      // How many sweaters fit beside the chosen one, and how far out they sit, both
      // come from the stage: a narrow stage shows fewer rather than clipping them.
      const show = halfW < .78 ? 0 : halfW < 1.05 ? 1 : 2;
      const side = Math.min(1, Math.max(.46, (halfW - .2) / Math.max(1, show)));
      const ki = KITS.findIndex(k => k[0] === shopKit);
      JV.slots.forEach((s, i) => {
        const off = i - ki, a = Math.abs(off);
        s.pivot.visible = a <= show;
        s.pivot.position.set(off * side, 0, off === 0 ? 0 : -.7);
        s.pivot.scale.setScalar(off === 0 ? 1 : a === 1 ? .58 : .42);
        s.mesh.material.uniforms.tint.value = off === 0 ? 1 : .5;
        if (off !== 0) s.pivot.rotation.y = -Math.sign(off) * .5;
      });
    },

    async mount(host, t, player) {
      try {
        await document.fonts.load('400 120px "Archivo Black"').catch(() => { });
        await JV.build();
        await JV.skin(t, player);
      } catch (e) { JV.ok = false; return false; }   // the photo cards stay visible
      if (!host.isConnected) return false;
      JV.host = host;
      host.appendChild(JV.ren.domElement);
      host.classList.add('on');
      JV.resize();
      JV.loop();
      return true;
    },

    resize() {
      if (!JV.ok || !JV.host) return;
      const r = JV.host.getBoundingClientRect();
      if (!r.width || !r.height) return;
      JV.ren.setSize(r.width, r.height, false);
      JV.cam.aspect = r.width / r.height; JV.cam.updateProjectionMatrix();
      JV.layout();
    },

    loop() {
      cancelAnimationFrame(JV.frame);
      const step = now => {
        if (!JV.ok || !JV.host || !JV.host.isConnected) return;
        const dt = JV.last ? Math.min((now - JV.last) / 1000, .05) : 0;
        JV.last = now;
        if (shopSpin && !reduce) { shopRot += dt * 19; shopAim = shopRot; }
        else shopRot += (shopAim - shopRot) * (reduce ? 1 : Math.min(1, dt * 7));
        const ki = KITS.findIndex(k => k[0] === shopKit);
        if (JV.slots[ki]) JV.slots[ki].pivot.rotation.y = shopRot * Math.PI / 180;
        JV.ren.render(JV.scene, JV.cam);
        JV.frame = requestAnimationFrame(step);
      };
      JV.frame = requestAnimationFrame(step);
    },

    unmount() {
      cancelAnimationFrame(JV.frame);
      JV.frame = 0; JV.last = 0;
      if (JV.ren && JV.ren.domElement.parentNode) JV.ren.domElement.parentNode.removeChild(JV.ren.domElement);
      JV.host = null;
    },
  };
  addEventListener('resize', () => JV.resize());

  // ---------- crest transition ----------
  function burst(card, id, go) {
    if (reduce) return go();
    const img = card.querySelector('.crest'), r = img.getBoundingClientRect(), t = T[id];
    fx.style.display = 'block'; fx.style.setProperty('--fxc', t.primary);
    const flood = fx.querySelector('.flood'), clone = img.cloneNode(true);
    clone.style.cssText = `position:absolute;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;padding:6px`;
    fx.appendChild(clone);
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const far = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy));
    flood.animate([{ clipPath: `circle(0px at ${cx}px ${cy}px)` }, { clipPath: `circle(${far}px at ${cx}px ${cy}px)` }],
      { duration: 430, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
    const dx = innerWidth / 2 - cx, dy = Math.min(innerHeight / 2, 240) - cy;
    const a = clone.animate([
      { transform: 'translate(0,0) scale(1) rotate(0deg)' },
      { transform: `translate(${dx * .5}px, ${dy * .5}px) scale(1.9) rotate(-12deg)`, offset: .55 },
      { transform: `translate(${dx}px, ${dy}px) scale(2.5) rotate(0deg)` },
    ], { duration: 560, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });
    a.onfinish = () => {
      go();
      const out = fx.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 320, easing: 'ease-out', fill: 'forwards' });
      out.onfinish = () => { fx.style.display = 'none'; fx.getAnimations().forEach(x => x.cancel()); clone.remove(); flood.getAnimations().forEach(x => x.cancel()); };
    };
  }

  // ---------- opening sequence ----------
  function playIntro() {
    let seen = false; try { seen = sessionStorage.getItem('dhl.intro') === '1'; } catch (e) { }
    if (seen || reduce) return;
    intro.hidden = false;
    document.getElementById('introCrests').innerHTML = D.teams.map(t => t.logo
      ? `<img src="assets/${t.logo}.jpg" alt="">`
      : `<span style="display:grid;place-items:center;background:${t.primary};color:${t.secondary};font-family:var(--disp);font-weight:700;font-size:12px">${esc(t.abbr)}</span>`).join('');
    const lock = intro.querySelector('.lock'), mono = intro.querySelector('.mono'),
      rule = intro.querySelector('.rule'), word = intro.querySelector('.word'),
      cr = [...intro.querySelectorAll('#introCrests img, #introCrests span')];
    const E = 'cubic-bezier(.22,1,.36,1)';
    lock.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 260, fill: 'forwards' });
    mono.animate([{ transform: 'scale(1.55)', filter: 'blur(12px)', opacity: 0 }, { transform: 'scale(1)', filter: 'blur(0px)', opacity: 1 }],
      { duration: 900, delay: 260, easing: E, fill: 'forwards' });
    rule.animate([{ width: '0px' }, { width: 'min(300px, 62vw)' }], { duration: 700, delay: 900, easing: E, fill: 'forwards' });
    word.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 650, delay: 1050, easing: E, fill: 'forwards' });
    cr.forEach((c, i) => c.animate([{ opacity: 0, transform: 'translateY(16px) scale(.8)' }, { opacity: 1, transform: 'none' }],
      { duration: 520, delay: 1500 + i * 85, easing: E, fill: 'forwards' }));
    // black veil lifts off the rink film, then the whole lockup clears
    intro.animate([{ background: '#000' }, { background: 'rgba(2,4,9,.55)' }], { duration: 900, delay: 700, easing: 'ease-out', fill: 'forwards' });
    const end = intro.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 650, delay: 3250, easing: 'ease-in', fill: 'forwards' });
    lock.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }], { duration: 650, delay: 3250, easing: 'ease-in', fill: 'forwards' });
    end.onfinish = closeIntro;
    intro.addEventListener('click', closeIntro);
    document.getElementById('skipIntro').addEventListener('click', closeIntro);
  }
  function closeIntro() {
    if (intro.hidden) return;
    intro.getAnimations().forEach(a => a.cancel());
    intro.querySelectorAll('*').forEach(el => el.getAnimations().forEach(a => a.cancel()));
    intro.hidden = true;
    try { sessionStorage.setItem('dhl.intro', '1'); } catch (e) { }
  }

  // ---------- router ----------
  let shotTimer = null;
  function route() {
    const h = (location.hash || '#home').slice(1);
    const inStore = h.startsWith('shop-');
    app.innerHTML = h.startsWith('team-') ? V.team(h.slice(5)) : inStore ? V.store(h.slice(5)) : (V[h] || V.home)();
    document.body.classList.toggle('shop', inStore || h === 'shop');
    document.querySelectorAll('#nav a').forEach(a => {
      const on = a.getAttribute('href') === '#' + (h.startsWith('team-') ? 'teams' : inStore ? 'shop' : h);
      on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
    });
    wire();
    scrollTo(0, 0);
  }
  function wire() {
    JV.unmount();
    app.querySelectorAll('.tcard').forEach(card => card.addEventListener('click', e => {
      e.preventDefault(); burst(card, card.dataset.team, () => { location.hash = 'team-' + card.dataset.team; });
    }));
    const ts = document.getElementById('teamSel'), ss = document.getElementById('sortSel');
    if (ts) ts.onchange = e => { pTeam = e.target.value; route(); };
    if (ss) ss.onchange = e => { pSort = e.target.value; route(); };
    app.querySelectorAll('.scard').forEach(card => card.addEventListener('click', e => {
      e.preventDefault(); storeBurst(card, card.dataset.shop, () => { location.hash = 'shop-' + card.dataset.shop; });
    }));
    wireStore();
    clearInterval(shotTimer); shotTimer = null;
    const shots = document.getElementById('shots');
    if (shots && !reduce) {
      const imgs = [...shots.querySelectorAll('img')]; let i = 0;
      shotTimer = setInterval(() => { imgs[i].classList.remove('on'); i = (i + 1) % imgs.length; imgs[i].classList.add('on'); }, 3600);
    }
  }

  fetch('league.json').then(r => r.json()).then(data => {
    D = data; D.teams.forEach(t => T[t.id] = t);
    document.getElementById('nav').innerHTML = ROUTES.map(([k, l]) => `<a href="#${k}">${l}</a>`).join('');
    document.getElementById('foot').innerHTML =
      `Davinky Hockey League · standings, ratings and rosters from the league document · <a href="${GAME_URL}" target="_blank" rel="noopener" style="color:var(--ice)">Play DHL 27 →</a>`;
    route();
    if (!location.hash || location.hash === '#home') playIntro();
    addEventListener('hashchange', route);
  }).catch(e => { app.innerHTML = `<div class="loading">Could not load the league data.<br><span class="small">${esc(e.message)}</span></div>`; });
})();
</script>

</body>
